name: Reconcile Semente ticket availability

on:
  schedule:
    # Midnight in Lisbon, year round. GitHub cron is UTC with no DST handling,
    # and Portugal is UTC+1 in summer, UTC+0 in winter, so both are listed.
    # One of the two is always exactly midnight Lisbon; the other is an hour
    # either side and harmless, because the job is idempotent.
    - cron: '0 23 * * *'   # midnight Lisbon, WEST (late Mar to late Oct)
    - cron: '0 0 * * *'    # midnight Lisbon, WET  (late Oct to late Mar)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reconcile Seeds of English
        working-directory: scripts
        env:
          TT_API_KEY: ${{ secrets.TT_API_KEY }}
        run: python reconcile.py --apply

      # always(), so a red run on one course still reconciles the other. Both
      # exit non-zero when oversold, and a failure in either fails the job.
      - name: Reconcile Atelier de Criatividade
        if: always()
        working-directory: scripts
        env:
          TT_API_KEY: ${{ secrets.TT_API_KEY }}
        run: python reconcile_atelier.py --apply

      # GitHub disables scheduled workflows after 60 days of repository
      # inactivity. This commits once per calendar month to keep the schedule
      # alive. It runs even when the reconcile step fails, because a persistent
      # failure must not be what kills the schedule.
      - name: Monthly keep-alive commit
        if: always()
        run: |
          month=$(date -u +%Y-%m)
          if [ "$(cat .keepalive 2>/dev/null)" = "$month" ]; then
            echo "Keep-alive already committed for $month."
            exit 0
          fi
          echo "$month" > .keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          git commit -m "Keep-alive $month"
          git push
