*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0A0A0B}
#rain{
  position:fixed;inset:0;width:100%;height:100%;
  transform:scaleX(-1);        /* mirrored katakana = the real Matrix trick */
  opacity:0;transition:opacity 1.2s ease;
  pointer-events:none;
}
</style>
</head>
<body>
<canvas id="rain" aria-hidden="true"></canvas>
<script>
'use strict';
/* Opacity: default 0.30. Override with #o=0.4 on the end of the file URL,
   or nudge live with the up/down arrow keys if the wallpaper has focus. */
var OP = 0.30;
(function(){
  var m = /o=([0-9.]+)/.exec(location.hash);
  if (m) OP = Math.max(0, Math.min(1, parseFloat(m[1])));
})();

var KANA = [];
for (var c = 0xFF66; c <= 0xFF9D; c++) KANA.push(String.fromCharCode(c));
for (var d = 0; d <= 9; d++) KANA.push(String(d));
function kana(){ return KANA[(Math.random()*KANA.length)|0]; }

var cvs = document.getElementById('rain'), ctx = cvs.getContext('2d', {alpha:false});
var W,H,dpr,size,cols,drops,speed;

function layout(){
  dpr = Math.min(window.devicePixelRatio||1, 1.5);
  W = window.innerWidth; H = window.innerHeight;
  cvs.width = Math.floor(W*dpr); cvs.height = Math.floor(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  size = W < 560 ? 13 : (W < 1100 ? 15 : 17);
  cols = Math.ceil(W/size) + 1;
  drops = new Array(cols); speed = new Array(cols);
  for (var i=0;i<cols;i++){ drops[i] = Math.random()*-60; speed[i] = .3 + Math.random()*.375; }
  ctx.fillStyle = '#0A0A0B'; ctx.fillRect(0,0,W,H);
}

function frame(){
  ctx.fillStyle = 'rgba(10,10,11,0.045)'; ctx.fillRect(0,0,W,H);
  ctx.font = '500 ' + size + 'px MtxGlyph, monospace'; ctx.textBaseline = 'top';
  for (var i=0;i<cols;i++){
    var y = drops[i]*size;
    if (y > -size){
      ctx.fillStyle = Math.random() > .94 ? '#FFF3DC' : '#FFD98A';
      ctx.fillText(kana(), i*size, y);
      ctx.fillStyle = 'rgba(255,176,0,0.4)';
      ctx.fillText(kana(), i*size, y - size);
    }
    drops[i] += speed[i];
    if (y > H && Math.random() > .975){ drops[i] = Math.random()*-30; speed[i] = .3 + Math.random()*.375; }
  }
}

/* 24fps, same as the site. Nothing else is running on this page. */
var last = 0, raf = null;
function loop(t){
  raf = requestAnimationFrame(loop);
  if (t - last < 42) return;
  last = t; frame();
}

function start(){
  layout();
  cvs.style.opacity = OP;
  if (!raf) raf = requestAnimationFrame(loop);
}

/* stop burning cycles when the desktop is covered or the display sleeps */
document.addEventListener('visibilitychange', function(){
  if (document.hidden){ if (raf){ cancelAnimationFrame(raf); raf = null; } }
  else if (!raf){ last = 0; raf = requestAnimationFrame(loop); }
});

var rt;
window.addEventListener('resize', function(){
  clearTimeout(rt); rt = setTimeout(layout, 180);
});

/* live opacity tuning: arrow up / down in 0.05 steps, logged so you can read it off */
window.addEventListener('keydown', function(e){
  if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
  OP = Math.max(0, Math.min(1, OP + (e.key === 'ArrowUp' ? .05 : -.05)));
  cvs.style.transition = 'none';
  cvs.style.opacity = OP;
  console.log('rain opacity', OP.toFixed(2));
});

if (document.fonts && document.fonts.load){
  document.fonts.load('500 16px MtxGlyph').then(start).catch(start);
} else { start(); }
</script>
</body>
</html>
