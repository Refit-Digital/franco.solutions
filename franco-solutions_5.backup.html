  --dim:#5C5A57;
  --rule:#3A3A42;      /* hairlines were near-invisible on this ground */
  --warn:#FF6B4A;
  --font-display:'Space Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --pad:clamp(1.15rem,5vw,2rem);
  --rail:1.5rem;      /* thread sits exactly this far left of the text */
  --gut:1.15rem;      /* indent under the › prompt */
  --tape:44rem;
}

*,*::before,*::after{box-sizing:border-box}
html,body{overflow-x:hidden}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--void);
  color:var(--text);
  font-family:var(--font-display);
  font-weight:500;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
::selection{background:var(--amber);color:var(--void)}

/* ============ RAIN ============ */
#rain{
  position:fixed;inset:0;width:100%;height:100%;z-index:0;
  transform:scaleX(-1);            /* mirrored katakana = the real Matrix trick */
  opacity:1;transition:opacity 1.1s ease .15s;pointer-events:none;
}
body.ready #rain{opacity:.1}

/* A saturated copy of the same rain, revealed only through a soft circular
   mask that follows the cursor. The code brightens where you point at it. */
/* one ring, expanding from where you pressed, lighting the code as it goes */
#rainPing{
  position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;
  transform:scaleX(-1);opacity:0;
  filter:saturate(2.6) brightness(1.7);
  -webkit-mask-image:radial-gradient(circle var(--pr,0px) at var(--px,-999px) var(--py,-999px),transparent 0%,transparent 64%,#000 86%,transparent 100%);
          mask-image:radial-gradient(circle var(--pr,0px) at var(--px,-999px) var(--py,-999px),transparent 0%,transparent 64%,#000 86%,transparent 100%);
}

/* ============ RATE DIAL ============ */
.rate{display:flex;flex-wrap:wrap;align-items:center;gap:.9rem;
  margin-top:1.2rem;padding-left:var(--gut)}
.col{display:flex;flex-direction:column;align-items:center}
.csym{position:relative;overflow:hidden;min-width:44px;height:var(--dialh);
  font-family:'MtxGlyph',var(--font-mono);font-size:clamp(1.7rem,7vw,2.4rem);line-height:1;
  color:var(--amber-soft)}
.csym b{position:absolute;inset:0;display:grid;place-items:center;font-weight:500}
.spin{--dialh:3.1rem;display:flex;align-items:center;gap:1.4rem;margin-right:.6rem;touch-action:pan-y}
/* controls are amber because amber is what "you can touch this" means here */
.arw{display:grid;place-items:center;min-width:44px;min-height:44px;
  font-family:var(--font-mono);font-size:1.5rem;line-height:1;
  color:var(--amber);opacity:.75;transition:opacity .15s,transform .12s}
.arw:hover{opacity:1}
.arw:active{transform:scale(.88)}
.arw:disabled{opacity:.2;cursor:default}
.arw svg{width:17px;height:17px;display:block}
.carw svg{width:14px;height:14px}
.restart svg{width:13px;height:13px;flex:none}
.val{display:grid;place-items:center;height:var(--dialh);padding:0 .35rem;
  font-family:'MtxGlyph',var(--font-mono);font-weight:500;color:var(--amber);
  font-size:clamp(1.7rem,7vw,2.4rem);font-variant-numeric:tabular-nums;line-height:1;
  letter-spacing:.02em;border-bottom:1px dashed var(--ember)}
.val:hover{border-bottom-color:var(--amber)}
.val .num{min-width:2.6ch;text-align:center}
.rate input.typed{
  width:4.5ch;height:var(--dialh);padding:0 .2rem;background:none;border:0;
  border-bottom:1px solid var(--amber);color:var(--amber);text-align:center;
  font-family:'MtxGlyph',var(--font-mono);font-size:clamp(1.7rem,7vw,2.4rem);
  font-variant-numeric:tabular-nums;
}
.rate input.typed:focus{outline:none}

.shell{position:relative;z-index:2}
.wrap{width:100%;max-width:var(--tape);margin-inline:auto;padding-inline:var(--pad)}

/* ============ NAV ============ */
/* no section links: there are no sections, only the conversation */
.nav{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;justify-content:space-between;gap:1rem;
  padding:.6rem var(--pad);
  background:rgba(10,10,11,.8);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid transparent;
  transition:opacity .7s ease .1s,border-color .3s ease;
}
.nav.stuck{border-bottom-color:var(--rule)}
.logo{display:flex;align-items:center;gap:.08rem;text-decoration:none;
  font-size:clamp(.98rem,3.6vw,1.1rem);min-height:44px;padding-block:.25rem}
.logo b{font-weight:700;letter-spacing:-.01em}
.logo span{font-family:var(--font-mono);font-weight:400;color:var(--amber)}
.caret{display:inline-block;width:.45em;height:1em;margin-left:.3em;
  background:var(--amber);vertical-align:-.14em;animation:blink 1.1s steps(1) infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.cmd-btn{display:grid;place-items:center;min-width:44px;min-height:44px;
  border:1px solid var(--rule);color:var(--amber)}
.cmd-btn:hover{border-color:var(--amber)}
.cmd-btn i{display:block;width:5px;height:12px;background:var(--amber);
  animation:blink 1.1s steps(1) infinite}

/* ============ HERO ============ */
.hero{padding-block:clamp(3rem,14vh,7rem) clamp(2rem,7vw,3rem);padding-left:calc(var(--pad) + var(--rail))}
.badge{
  display:inline-flex;align-items:center;gap:.55rem;
  font-family:var(--font-mono);font-size:.78rem;letter-spacing:.02em;
  color:var(--muted);margin-bottom:1.4rem;
}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--live);
  flex:none;animation:heartbeat 2.4s ease-in-out infinite}
/* lub-dub, then rest. The rhythm is what makes it read as a pulse. */
@keyframes heartbeat{
  0%{transform:scale(1)} 10%{transform:scale(1.45)} 20%{transform:scale(1)}
  30%{transform:scale(1.28)} 44%,100%{transform:scale(1)}
}
h1{
  font-weight:700;letter-spacing:-.03em;line-height:1.04;margin:0;
  font-size:clamp(1.9rem,7.6vw,3.3rem);overflow-wrap:break-word;
}
.sub{color:var(--muted);margin:1.1rem 0 0;font-size:clamp(.98rem,2.6vw,1.1rem);max-width:34ch}

/* char assembly. Every frame written by the rAF engine in JS, deliberately
   no CSS transitions: they raced with the class toggles in the last version. */
.w{display:inline-block;white-space:nowrap}
.ch{display:inline-block;text-align:center}
.ch.flying{will-change:transform,opacity}
.ch.scramble{font-family:'MtxGlyph',var(--font-mono)}

/* ============ THE TAPE ============ */
/* One thread running down the page. Every exchange hangs off it.
   No cards, no panels, no icons in rounded boxes. */
/* the thread is drawn by each beat, not the container: a left margin on
   top of .wrap's padding pushed the whole page sideways on a phone */
#tape{padding-bottom:clamp(4rem,20vh,9rem)}
.beat{
  position:relative;
  border-left:1px solid var(--rule);
  padding:clamp(1.5rem,5vw,2.2rem) 0 0 var(--rail);
  scroll-margin-top:6rem;
}
.beat:last-child{padding-bottom:clamp(2rem,8vw,3.5rem)}
/* the tick that attaches this exchange to the thread */
.beat::before{
  content:'';position:absolute;left:0;top:calc(clamp(1.5rem,5vw,2.2rem) + .62em);
  width:var(--rail);height:1px;background:var(--rule);
}
.beat.live::before{background:var(--amber);transform-origin:left;
  animation:heartbeat 2.4s ease-in-out infinite}
.beat.answered::before{background:var(--ember)}

.q{
  display:flex;gap:.6rem;align-items:baseline;
  font-size:clamp(1.15rem,4.4vw,1.6rem);font-weight:700;letter-spacing:-.02em;
  line-height:1.25;margin:0;
}
.q::before{content:'›';color:var(--amber);font-family:var(--font-mono);font-weight:400;flex:none}
.beat.answered .q{font-size:clamp(.9rem,3vw,1rem);font-weight:500;color:var(--dim)}

/* choices */
.opts{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1.1rem;padding-left:var(--gut)}
.chip{
  min-height:44px;padding:.6rem 1rem;
  border:1px solid var(--rule);
  font-family:var(--font-mono);font-size:.84rem;color:var(--text);
  text-align:left;transition:border-color .15s,color .15s,background .15s;
}
.chip:hover{border-color:var(--amber);color:var(--amber)}
.chip:active{background:var(--amber);color:var(--void)}

/* their answer, once given */
.ans{
  display:inline-flex;align-items:center;gap:.55rem;
  margin-top:.35rem;padding-left:var(--gut);
  font-family:var(--font-mono);font-size:.92rem;color:var(--amber);
  text-align:left;min-height:44px;
}
.ans em{font-style:normal;color:var(--dim);font-size:.72rem;opacity:.6;transition:opacity .15s,color .15s;
  border-bottom:1px solid var(--rule);line-height:1.3}
.ans:hover em,.ans:focus-visible em{opacity:1;color:var(--amber)}
.beat.answered{opacity:.55;transition:opacity .25s}
.beat.answered:hover,.beat.answered:focus-within{opacity:.85}

/* Franco talking back */
.say{padding-left:var(--gut);margin-top:.9rem;color:var(--muted);
  font-size:clamp(.97rem,2.5vw,1.05rem);max-width:44ch}
.say strong{color:var(--text);font-weight:500}
.say + .say{margin-top:.7rem}

/* the multiply-out */
.figs{margin:1.5rem 0 0;padding:1.1rem 0 1.1rem 1.15rem;
  border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.fig{display:flex;align-items:baseline;gap:.8rem;padding:.22rem 0;min-width:0;
  font-family:var(--font-mono);font-size:.8rem;color:var(--dim)}
.fig span{min-width:0;overflow-wrap:anywhere}
.fig b{font-family:'MtxGlyph',var(--font-mono);font-weight:500;color:var(--amber);
  font-size:clamp(1.25rem,5vw,1.8rem);letter-spacing:.02em;
  font-variant-numeric:tabular-nums;min-width:6.5ch;text-align:right;flex:none}
.fig.big b{color:var(--amber-soft)}
.caveat{padding-left:var(--gut);margin:.9rem 0 0;font-family:var(--font-mono);
  font-size:.72rem;color:var(--dim);line-height:1.6}

/* live work, as rows on the thread — not cards */
.work{margin-top:1.2rem;padding-left:var(--gut)}
.job{
  display:flex;flex-wrap:wrap;align-items:baseline;gap:.2rem .9rem;
  padding:.95rem 0;border-top:1px solid var(--rule);
  text-decoration:none;min-height:44px;
}
.job:last-child{border-bottom:1px solid var(--rule)}
.job b{font-weight:700;font-size:1rem;flex:1 1 9rem;min-width:0}
.job span{font-family:var(--font-mono);font-size:.75rem;color:var(--dim)}
.job u{text-decoration:none;font-family:var(--font-mono);font-size:.78rem;color:var(--amber)}
.job i{flex:1 0 100%;font-style:normal;font-family:var(--font-mono);font-size:.73rem;color:var(--dim);line-height:1.5}
.job:hover b{color:var(--amber)}

/* the composed email */
.mail{
  margin-top:1.3rem;margin-left:1.15rem;
  border:1px solid var(--ember);
  font-family:var(--font-mono);font-size:.78rem;line-height:1.75;
}
.mail-h{padding:.7rem .9rem;border-bottom:1px solid var(--rule);color:var(--dim)}
.mail-h b{color:var(--muted);font-weight:400}
.mail-b{padding:.9rem;white-space:pre-wrap;color:var(--text);word-break:break-word}
.field{display:flex;flex-wrap:wrap;gap:.5rem;margin:1.1rem 0 0;padding-left:var(--gut)}
input[type=text]{
  flex:1 1 12rem;min-width:0;min-height:48px;padding:.7rem .9rem;
  background:var(--void);border:1px solid var(--rule);color:var(--text);
  font-family:var(--font-mono);font-size:.86rem;
}
input[type=text]:focus{outline:none;border-color:var(--amber)}
.acts{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1.1rem;padding-left:var(--gut)}
.go{
  min-height:48px;padding:.8rem 1.5rem;
  background:var(--amber);color:var(--void);border:1px solid var(--amber);
  font-family:var(--font-mono);font-size:.88rem;font-weight:500;
  text-decoration:none;display:inline-flex;align-items:center;justify-content:center;
  animation:heartbeat-btn 2.4s ease-in-out infinite;
}
@keyframes heartbeat-btn{
  0%{box-shadow:0 0 0 0 rgba(255,176,0,.5)} 10%{box-shadow:0 0 0 8px rgba(255,176,0,0)}
  20%{box-shadow:0 0 0 0 rgba(255,176,0,.34)} 30%{box-shadow:0 0 0 5px rgba(255,176,0,0)}
  44%,100%{box-shadow:0 0 0 0 rgba(255,176,0,0)}
}
.go:hover{background:var(--amber-soft);border-color:var(--amber-soft);animation-play-state:paused}
.alt{
  min-height:48px;padding:.8rem 1.2rem;border:1px solid var(--rule);
  font-family:var(--font-mono);font-size:.85rem;color:var(--text);
  position:relative;z-index:1;
}
.alt:hover{border-color:var(--muted)}

.restart{
  margin-top:2.2rem;padding-left:var(--gut);
  font-family:var(--font-mono);font-size:.76rem;color:var(--dim);
  min-height:44px;display:inline-flex;align-items:center;gap:.5rem;
}
.restart:hover{color:var(--amber)}

/* ============ FOOTER ============ */
footer{border-top:1px solid var(--rule);padding-block:1.8rem;margin-top:2rem}
.foot{display:flex;flex-wrap:wrap;gap:.8rem 1.2rem;align-items:center;justify-content:space-between;
  font-family:var(--font-mono);font-size:.74rem;color:var(--dim)}
.foot a{color:var(--dim);text-decoration:none}
.foot a:hover{color:var(--amber)}
kbd{font-family:var(--font-mono);font-size:.7rem;padding:.1rem .35rem;
  border:1px solid var(--rule);color:var(--amber)}

/* ============ PALETTE ============ */
.pal{position:fixed;inset:0;z-index:60;display:none;align-items:flex-start;justify-content:center;
  padding:clamp(1rem,10vh,7rem) var(--pad) 2rem;background:rgba(10,10,11,.85);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.pal.open{display:flex}
.pal-box{width:100%;max-width:30rem;background:var(--void);border:1px solid var(--amber)}
.pal-in{display:flex;align-items:center;gap:.6rem;padding:.85rem 1rem;border-bottom:1px solid var(--rule)}
.pal-in span{color:var(--amber);font-family:var(--font-mono)}
.pal-in input{flex:1;min-width:0;background:none;border:0;color:var(--text);
  font-family:var(--font-mono);font-size:.95rem;min-height:32px}
.pal-in input:focus{outline:none}
.pal-list{margin:0;padding:.3rem;list-style:none;max-height:50vh;overflow-y:auto}
.pal-list li{display:flex;align-items:center;gap:.8rem;min-height:44px;padding:.5rem .7rem;
  cursor:pointer;font-family:var(--font-mono);font-size:.83rem;color:var(--muted)}
.pal-list li.sel,.pal-list li:hover{background:#141416;color:var(--text)}
.pal-list li b{color:var(--amber);font-weight:400;min-width:6rem}
.pal-foot{padding:.5rem 1rem;border-top:1px solid var(--rule);
  font-family:var(--font-mono);font-size:.68rem;color:#3E3E42}

/* ============ BOOT ============ */
body.booting .nav,body.booting .badge,body.booting .sub,body.booting #tape,body.booting footer{opacity:0}
.nav,.badge,.sub,#tape,footer{opacity:1;transition:opacity .7s ease .1s}
body.booting{overflow:hidden}
.skip{position:fixed;left:50%;bottom:max(1.4rem,env(safe-area-inset-bottom));
  transform:translateX(-50%);z-index:30;font-family:var(--font-mono);font-size:.7rem;
  letter-spacing:.1em;text-transform:uppercase;color:#4A4A50;pointer-events:none;transition:opacity .4s}
body:not(.booting) .skip{opacity:0}

/* new beats arrive */
.beat{animation:beat-in .42s cubic-bezier(.16,.9,.3,1) both}
@keyframes beat-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.beat.answered{animation:none}

@media (prefers-reduced-motion:reduce){
  .live-dot,.beat.live::before,.go,.caret,.cmd-btn i{animation:none}
  #rainPing{display:none}
  .beat{animation:none}
  .ch{opacity:1!important;transform:none!important}
  #rain{opacity:.09}
}

function mix(a,b,t){ return 'rgb(' + ((a[0]+(b[0]-a[0])*t)|0) + ',' +
  ((a[1]+(b[1]-a[1])*t)|0) + ',' + ((a[2]+(b[2]-a[2])*t)|0) + ')'; }

var animT0 = 0, animRaf = null;

function plan(){
  var last = Math.max(1, CH.length - 1);
  CH.forEach(function(c,i){
    var a = Math.random()*Math.PI*2, d = 90 + Math.random()*170;
    c.dx = Math.cos(a)*d; c.dy = Math.sin(a)*d*.85;
    c.rot = (Math.random()-.5)*46;
    c.delay = LEAD + (i/last)*SPREAD + Math.random()*60;
    c.dur = FLY + Math.random()*150;
    c.swap = 0; c.state = 0;
    c.el.className = 'ch flying'; c.el.style.opacity = '0';
    c.el.style.transform = 'translate3d('+c.dx.toFixed(1)+'px,'+c.dy.toFixed(1)+'px,0) rotate('+c.rot.toFixed(1)+'deg) scale(.45)';
  });
}
function settleAll(){
  if (animRaf){ cancelAnimationFrame(animRaf); animRaf = null; }
  CH.forEach(function(c){
    c.state = 3; c.el.className = 'ch'; c.el.textContent = c.ch;
    c.el.style.transform = ''; c.el.style.opacity = ''; c.el.style.color = '';
  });
  thawLayout();
}
function step(now){
  var t = now - animT0, live = false;
  for (var i = 0; i < CH.length; i++){
    var c = CH[i];
    if (c.state === 3) continue;
    live = true;
    var lt = (t - c.delay) / c.dur;
    if (lt <= 0) continue;
    if (lt < 1){
      if (c.state === 0){ c.state = 1; c.el.className = 'ch flying scramble'; }
      var e = swoop(lt), sc = .6 + .4*e;
      c.el.style.transform = 'translate3d('+(c.dx*(1-e)).toFixed(1)+'px,'+(c.dy*(1-e)).toFixed(1)+'px,0) rotate('+(c.rot*(1-e)).toFixed(1)+'deg) scale('+sc.toFixed(3)+')';
      c.el.style.opacity = Math.min(1, lt*4).toFixed(3);
      c.el.style.color = mix(AMBER, FLASH, Math.min(1, lt*1.3));
      if (t >= c.swap){ c.el.textContent = kana(); c.swap = t + 36 + lt*130; }
      continue;
    }
    if (c.state < 2){
      c.state = 2; c.landed = t; c.el.className = 'ch flying';
      c.el.textContent = c.ch;
      c.el.style.transform = 'translate3d(0,0,0)'; c.el.style.opacity = '1';
    }
    var k = (t - c.landed)/COOL;
    if (k >= 1){ c.state = 3; c.el.className = 'ch';
      c.el.style.transform=''; c.el.style.opacity=''; c.el.style.color=''; }
    else c.el.style.color = mix(FLASH, TEXT, outCubic(k));
  }
  if (live) animRaf = requestAnimationFrame(step);
  else { animRaf = null; thawLayout(); }
}
function assemble(){
  if (RM){ settleAll(); return; }
  freezeLayout(); plan();
  animT0 = performance.now();
  if (animRaf) cancelAnimationFrame(animRaf);
  animRaf = requestAnimationFrame(step);
}

   3  RAIN
================================================================== */
var cvs = document.getElementById('rain'), ctx = cvs.getContext('2d', {alpha:false});
var ping = document.getElementById('rainPing'), pctx = ping.getContext('2d');
var W,H,dpr,size,cols,drops,speed;
function layout(){
  dpr = Math.min(window.devicePixelRatio||1, 1.5);
  W = window.innerWidth; H = window.innerHeight;
  cvs.width = Math.floor(W*dpr); cvs.height = Math.floor(H*dpr);
  ping.width = cvs.width; ping.height = cvs.height;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  pctx.setTransform(dpr,0,0,dpr,0,0);
  size = W < 560 ? 13 : (W < 1100 ? 15 : 17);
  cols = Math.ceil(W/size) + 1;
  drops = new Array(cols); speed = new Array(cols);
  for (var i=0;i<cols;i++){ drops[i] = Math.random()*-60; speed[i] = .6 + Math.random()*.75; }
  ctx.fillStyle = '#0A0A0B'; ctx.fillRect(0,0,W,H);
}
function frame(){
  ctx.fillStyle = 'rgba(10,10,11,0.085)'; ctx.fillRect(0,0,W,H);
  ctx.font = '500 ' + size + 'px MtxGlyph, monospace'; ctx.textBaseline = 'top';
  for (var i=0;i<cols;i++){
    var y = drops[i]*size;
    if (y > -size){
      ctx.fillStyle = Math.random() > .94 ? '#FFF3DC' : '#FFD98A';
      ctx.fillText(kana(), i*size, y);
      ctx.fillStyle = 'rgba(255,176,0,0.4)';
      ctx.fillText(kana(), i*size, y - size);
    }
    drops[i] += speed[i];
    if (y > H && Math.random() > .975){ drops[i] = Math.random()*-30; speed[i] = .6 + Math.random()*.75; }
  }
}

/* ---- click ripple ----------------------------------------------------
   Runs on its own 60fps loop rather than the rain's 24fps one, so the ring
   expands smoothly even though the code behind it redraws slower. */
var PING_MS = 950, pingT0 = 0, pingRaf = null, pingR = 0;
function startPing(x, y){
  if (RM || !W) return;
  /* reach the furthest corner, so the ring always leaves the screen
     rather than stopping short in the middle of nowhere */
  pingR = Math.max(Math.hypot(x, y), Math.hypot(W - x, y),
                   Math.hypot(x, H - y), Math.hypot(W - x, H - y));
  pingT0 = performance.now();
  ping.style.setProperty('--px', (W - x).toFixed(0) + 'px');   /* canvas is mirrored */
  ping.style.setProperty('--py', y.toFixed(0) + 'px');
  if (!pingRaf) pingRaf = requestAnimationFrame(pingStep);
}
function pingStep(now){
  var t = (now - pingT0) / PING_MS;
  if (t >= 1){
    ping.style.opacity = '0';
    ping.style.setProperty('--pr', '0px');
    pctx.clearRect(0, 0, W, H);
    pingRaf = null;
    return;
  }
  var e = 1 - Math.pow(1 - t, 2.4);
  pctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  pctx.clearRect(0, 0, W, H);
  pctx.drawImage(cvs, 0, 0, W, H);
  ping.style.setProperty('--pr', (e * pingR).toFixed(0) + 'px');
  /* stays lit most of the way out instead of dying halfway */
  ping.style.opacity = (0.92 * (1 - t * t)).toFixed(3);
  pingRaf = requestAnimationFrame(pingStep);
}
/* only where there is nothing to press: buttons and links have their own feedback */
document.addEventListener('pointerdown', function(e){
  startPing(e.clientX, e.clientY);
}, { passive:true });


var last = 0, raf = null;
function loop(t){
  raf = requestAnimationFrame(loop);
  var stepMs = window.scrollY > window.innerHeight ? 90 : 42;
  if (t - last < stepMs) return;
  last = t; frame();
}
function startRain(){ layout(); if (RM){ frame(); return; } if (!raf) raf = requestAnimationFrame(loop); }
document.addEventListener('visibilitychange', function(){
  if (document.hidden){ if (raf){ cancelAnimationFrame(raf); raf = null; } }
  else if (!RM && !raf){ last = 0; raf = requestAnimationFrame(loop); }
});
var rt, lastW = window.innerWidth;
window.addEventListener('resize', function(){
  /* only a real WIDTH change can rewrap the pinned headline. Mobile browsers
     fire resize every time the URL bar hides, which must not kill the intro. */
  if (animRaf && Math.abs(window.innerWidth - lastW) > 2){ settleAll(); finish(); }
  lastW = window.innerWidth;
  clearTimeout(rt); rt = setTimeout(layout, 180);
});

var booted = false;
function finish(){
  if (booted) return;
  booted = true;
  document.body.classList.remove('booting');
  document.body.classList.add('ready');
  armSkip(false);
  if (!tapeStarted) ask('start');
}
function skip(){ settleAll(); finish(); }
function armSkip(on){
  var f = on ? 'addEventListener' : 'removeEventListener';
  window[f]('pointerdown', skip, {passive:true});
  window[f]('keydown', skip);
  window[f]('wheel', skip, {passive:true});
  window[f]('touchstart', skip, {passive:true});
}
var seen = false;
try { seen = sessionStorage.getItem('fs_seen') === '1'; } catch(e){}

function boot(){
  startRain();
  if (RM || seen){ settleAll(); finish(); return; }
  try { sessionStorage.setItem('fs_seen','1'); } catch(e){}
  armSkip(true);
  assemble();
  setTimeout(finish, LEAD + SPREAD + FLY - 240);
}
if (document.fonts && document.fonts.ready){
  document.fonts.load('500 16px MtxGlyph').catch(function(){});
  Promise.race([document.fonts.ready, new Promise(function(r){ setTimeout(r, 1100); })]).then(boot, boot);
} else boot();

document.addEventListener('pointerdown', function once(){

  if (!booted) setTimeout(skip, 60);
}, {passive:true});

/* ---------- rendering ---------- */
/* Space Grotesk and IBM Plex Mono contain none of the arrow or refresh
   glyphs, so those were rendering from whatever the device happened to have.
   Drawn instead, so every phone gets the same shape at the same weight. */
var ICO = {
  up:   'M4 10.25 8 5.75l4 4.5',
  down: 'M4 5.75 8 10.25l4-4.5',
  left: 'M10.25 3 5.75 8l4.5 5',
  right:'M5.75 3 10.25 8l-4.5 5',
  redo: 'M13 8.4a5 5 0 1 1-1.6-3.9M13.4 1.6v3.4H10'
};
function ico(name){
  return '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.9" '
       + 'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">'
       + '<path d="' + ICO[name] + '"/></svg>';
}

function el(tag, cls, html){
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (html != null) n.innerHTML = html;
  return n;
}
/* Scroll the minimum that keeps the new text on screen. Jumping the new beat
   to centre threw away everything the visitor had just read. */
function focusBeat(node){
  if (!node) return;
  setTimeout(function(){
    var r  = node.getBoundingClientRect();
    var vh = window.innerHeight;
    var topGap = 76, botGap = 28;   /* nav height, breathing room */
    var by = 0;
    if (r.height > vh - topGap - botGap){
      by = r.top - topGap;                      /* taller than the screen: pin its top */
    } else if (r.bottom > vh - botGap){
      by = r.bottom - (vh - botGap);            /* just enough to show all of it */
    } else if (r.top < topGap){
      by = r.top - topGap;                      /* it drifted under the nav */
    }
    if (Math.abs(by) > 2) window.scrollBy({ top: by, behavior: RM ? 'auto' : 'smooth' });
  }, RM ? 0 : 90);
}

function ask(key){
  tapeStarted = true;
  var s = SCRIPT[key];
  if (!s) return;

  /* only the newest exchange is live: note-beats never answered, so they
     kept the pulsing tick forever */
  var prev = tape.querySelectorAll('.beat.live');
  for (var i = 0; i < prev.length; i++) prev[i].classList.remove('live');

  var beat = el('div','beat live');
  beat.dataset.key = key;

  if (s.note) s.note(beat);

  if (s.q){
    beat.appendChild(el('p','q', esc(s.q)));
    if (s.widget){
      s.widget(beat, key, s.go);
    } else {
      var opts = el('div','opts');
      s.opts.forEach(function(o){
        var b = el('button','chip', esc(o.t));
        b.type = 'button';
        b.addEventListener('click', function(){ answer(key, o); });
        opts.appendChild(b);
      });
      beat.appendChild(opts);
    }
  }

  tape.appendChild(beat);
  trail.push({ key:key, node:beat });
  focusBeat(beat);

  /* A note with something to read waits for a tap. It used to auto-advance,
     which scrolled the figures off the screen before anyone could read them. */
  if (!s.q){
    if (s.cont){
      var more = el('div','opts');
      var mb = el('button','chip', esc(s.cont));
      mb.type = 'button';
      mb.addEventListener('click', function(){
        beat.classList.remove('live');
        more.remove();
        ask(s.go);
      });
      more.appendChild(mb);
      beat.appendChild(more);
    } else if (s.go){
      setTimeout(function(){ ask(s.go); }, RM ? 0 : 520);
    }
  }
}

function answer(key, o){ commit(key, o.k, o.t, o.go); }

function commit(key, value, shown, go){
  var rec = trail[trail.length - 1];
  if (!rec || rec.key !== key) return;
  A[key] = value;
  rec.ansText = shown;

  var beat = rec.node;
  beat.classList.remove('live');
  beat.classList.add('answered');
  ['.opts','.rate'].forEach(function(sel){
    var n = beat.querySelector(sel); if (n) n.remove();
  });

  var a = el('button','ans', esc(shown) + ' <em>change</em>');
  a.type = 'button';
  a.setAttribute('aria-label', shown + ' — click to change this answer');
  a.addEventListener('click', function(){ rewindTo(key); });
  beat.appendChild(a);

  ask(go);
}

/* ------------------------------------------------------------------
   The rate dial. Four buttons could not cover every trade, so this is
   a real number: wheel over it, tap the arrows, or click it and type.
------------------------------------------------------------------ */
function rateDial(beat, key, go){
  var MIN = 5, MAX = 400, STEP = 5;
  var target = 25, shownVal = 25, dialRaf = null, editing = false;
  var CURS = ['\u20AC','\u00A3'];

  var wrap = el('div','rate');
  var spin = el('div','spin');

  /* both axes run vertically: two spinners side by side */
  var down = el('button','arw', ico('down')); down.type = 'button'; down.setAttribute('aria-label','less');
  var up   = el('button','arw', ico('up'));   up.type   = 'button'; up.setAttribute('aria-label','more');

  var cur   = el('div','col cur');
  var amt   = el('div','col amt');
  var cUp   = el('button','arw carw', ico('up'));   cUp.type   = 'button';
  var cDown = el('button','arw carw', ico('down')); cDown.type = 'button';
  cUp.setAttribute('aria-label','currency, previous');
  cDown.setAttribute('aria-label','currency, next');
  var cSym  = el('div','csym','');
  cSym.setAttribute('role','status');
  var cFace = el('b','', CUR);
  cSym.appendChild(cFace);

  var val = el('button','val','');
  val.type = 'button';
  val.setAttribute('aria-label','Your hourly rate. Click to type it.');
  var num = el('span','num','25');
  val.appendChild(num);

  /* the symbol rolls in the direction you pushed it */
  function rollTo(next, dir){
    if (RM || !cFace.animate){ cFace.textContent = next; return; }
    var out = cFace;
    var inn = document.createElement('b');
    inn.textContent = next;
    cSym.appendChild(inn);
    var ease = 'cubic-bezier(.3,0,.2,1)', ms = 280;
    out.animate([{transform:'translateY(0)',opacity:1},
                 {transform:'translateY(' + (-dir*105) + '%)',opacity:0}],
                {duration:ms, easing:ease, fill:'forwards'});
    inn.animate([{transform:'translateY(' + (dir*105) + '%)',opacity:0},
                 {transform:'translateY(0)',opacity:1}],
                {duration:ms, easing:ease, fill:'forwards'});
    setTimeout(function(){ if (out.parentNode) out.remove(); }, ms + 30);
    cFace = inn;
  }
  function cycleCur(d){
    var next = CURS[(CURS.indexOf(CUR) + d + CURS.length) % CURS.length];
    if (next === CUR) return;
    CUR = next;
    rollTo(CUR, d);
  }
  cUp.addEventListener('click',   function(){ cycleCur(-1); });
  cDown.addEventListener('click', function(){ cycleCur(1); });
  cur.addEventListener('wheel', function(e){ cycleCur(e.deltaY > 0 ? 1 : -1); e.preventDefault(); },
                       { passive:false });
  cur.appendChild(cUp); cur.appendChild(cSym); cur.appendChild(cDown);

  amt.appendChild(up); amt.appendChild(val); amt.appendChild(down);
  spin.appendChild(cur); spin.appendChild(amt);
  wrap.appendChild(spin);

  var ok = el('button','chip','that\u2019s about right');
  ok.type = 'button';
  ok.addEventListener('click', function(){
    if (editing) stopTyping();
    commit(key, target, CUR + target + ' an hour', go);
  });
  wrap.appendChild(ok);

  function paintVal(){
    num.textContent = String(Math.round(shownVal));
    down.disabled = target <= MIN;
    up.disabled   = target >= MAX;
  }
  function animate(){
    var d = target - shownVal;
    if (Math.abs(d) < .5){ shownVal = target; paintVal(); dialRaf = null; return; }
    shownVal += d * .22;
    paintVal();
    dialRaf = requestAnimationFrame(animate);
  }
  function setTo(v){
    v = Math.max(MIN, Math.min(MAX, Math.round(v)));
    if (v === target) return false;
    target = v;
    if (RM){ shownVal = target; paintVal(); }
    else if (!dialRaf) dialRaf = requestAnimationFrame(animate);
    return true;
  }
  down.addEventListener('click', function(){ setTo(target - STEP); });
  up.addEventListener('click',   function(){ setTo(target + STEP); });

  /* only swallow the page scroll when the wheel actually moved the number,
     so hitting either end scrolls the page normally instead of trapping */
  amt.addEventListener('wheel', function(e){
    if (editing) return;
    var dir = e.deltaY > 0 ? -1 : 1;
    if (setTo(target + dir * STEP)) e.preventDefault();
  }, { passive:false });

  var typed = null;
  function startTyping(){
    if (editing) return;
    editing = true;
    typed = document.createElement('input');
    typed.type = 'text'; typed.className = 'typed';
    typed.inputMode = 'numeric'; typed.value = String(target);
    typed.setAttribute('aria-label','Your hourly rate');
    val.replaceWith(typed);
    typed.focus(); typed.select();
    typed.addEventListener('keydown', function(e){
      if (e.key === 'Enter'){ e.preventDefault(); stopTyping(); }
      else if (e.key === 'Escape'){ typed.value = String(target); stopTyping(); }
    });
    typed.addEventListener('blur', stopTyping);
  }
  function stopTyping(){
    if (!editing) return;
    editing = false;
    var n = parseInt(String(typed.value).replace(/[^0-9]/g,''), 10);
    if (!isNaN(n)) target = Math.max(MIN, Math.min(MAX, n));
    shownVal = target;
    typed.replaceWith(val);
    typed = null;
    paintVal();
  }
  val.addEventListener('click', startTyping);

  paintVal();
  beat.appendChild(wrap);
}

/* going back is the whole point of a transcript you can point at */
function rewindTo(key){
  var i = trail.findIndex(function(r){ return r.key === key; });
  if (i < 0) return;
  trail.slice(i).forEach(function(r){ if (r.node && r.node.parentNode) r.node.remove(); });
  trail = trail.slice(0, i);
  Object.keys(SCRIPT).forEach(function(k){
    if (!trail.some(function(r){ return r.key === k; })) delete A[k];
  });
  ask(key);
}

function restart(){
  tape.textContent = '';
  trail = []; A = {};
  ask('start');
}

/* ---------- number that resolves out of the code ---------- */
function countUp(node, value, suffix){
  var txt = (suffix || '') + value.toLocaleString('en-GB');
  if (RM){ node.textContent = txt; return; }
  var t0 = performance.now(), dur = 780, len = txt.length;
  (function tickNum(now){
    var p = Math.min(1, (now - t0) / dur);
    var lock = Math.floor(p * len);
    var out = txt.slice(0, lock);
    for (var i = lock; i < len; i++) out += kana();
    node.textContent = out;
    if (p < 1) requestAnimationFrame(tickNum);
    else node.textContent = txt;
  })(t0);
}
function fig(beat, label, value, suffix, big){
  var row = el('div','fig' + (big ? ' big' : ''));
  var b = el('b','', '');
  row.appendChild(b);
  row.appendChild(el('span','', esc(label)));
  beat.querySelector('.figs').appendChild(row);

/* the async Clipboard API is blocked in sandboxed iframes and silently leaves
   whatever was on the clipboard before, so fall back to a real selection copy
   and report honestly when neither worked */
function copyText(t, done){
  function legacy(){
    var ta = document.createElement('textarea');
    ta.value = t;
    ta.setAttribute('readonly','');
    ta.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0';
    document.body.appendChild(ta);
    ta.select(); ta.setSelectionRange(0, t.length);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch(e){ ok = false; }
    ta.remove();
    done(ok);
  }
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(function(){ done(true); }, legacy);
  } else legacy();
}

function paint(){
  palList.textContent = '';
  filtered.forEach(function(c,i){
    var li = el('li','', '<b>' + c.k + '</b><span>' + esc(c.d) + '</span>');
    if (i === sel) li.className = 'sel';
    li.addEventListener('click', c.run);

  });
}
function openPal(){
  pal.classList.add('open'); palInput.value = '';
  filtered = CMDS.slice(); sel = 0; paint();
  setTimeout(function(){ palInput.focus(); }, 30);
}
function closePal(){ pal.classList.remove('open'); }
document.getElementById('palOpen').addEventListener('click', openPal);

palInput.addEventListener('input', function(){
  var q = palInput.value.toLowerCase();
  filtered = CMDS.filter(function(c){ return (c.k + ' ' + c.d).toLowerCase().indexOf(q) > -1; });
  sel = 0; paint();
});
palInput.addEventListener('keydown', function(e){
  if (e.key === 'ArrowDown'){ e.preventDefault(); sel = Math.min(sel+1, filtered.length-1); paint(); }
  else if (e.key === 'ArrowUp'){ e.preventDefault(); sel = Math.max(sel-1, 0); paint(); }
  else if (e.key === 'Enter'){ e.preventDefault(); if (filtered[sel]) filtered[sel].run(); }
  else if (e.key === 'Escape') closePal();
});
var buf = '';
document.addEventListener('keydown', function(e){
  if (pal.classList.contains('open')) return;
  var t = e.target.tagName;
  if (t === 'INPUT' || t === 'TEXTAREA') return;
  if (e.key === 'Escape'){ closePal(); return; }
  if (e.key.length !== 1) return;
  buf = (buf + e.key.toLowerCase()).slice(-6);

});
